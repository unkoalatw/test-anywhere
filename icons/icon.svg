<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3B82F6" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  
  <!-- Subtle Grid Pattern in BG -->
  <path d="M64 160h384M64 256h384M64 352h384M160 64v384M256 64v384M352 64v384" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>
  
  <!-- Glowing Hexagon / Shield Backdrop -->
  <polygon points="256,100 380,170 380,310 256,380 132,310 132,170" fill="url(#glowGrad)" stroke="rgba(99,102,241,0.3)" stroke-width="2"/>

  <!-- Academic Cap / Chart Motif -->
  <!-- Bar Chart Columns -->
  <rect x="160" y="280" width="36" height="80" rx="6" fill="#4B5563" opacity="0.8"/>
  <rect x="214" y="230" width="36" height="130" rx="6" fill="#3B82F6" filter="url(#shadow)"/>
  <rect x="268" y="180" width="36" height="180" rx="6" fill="#6366F1" filter="url(#shadow)"/>
  <rect x="322" y="130" width="36" height="230" rx="6" fill="#10B981" filter="url(#shadow)"/>

  <!-- Trajectory Trend Line with Star/Dot -->
  <path d="M178 270 L232 215 L286 165 L340 115" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="178" cy="270" r="7" fill="#F59E0B"/>
  <circle cx="232" cy="215" r="7" fill="#F59E0B"/>
  <circle cx="286" cy="165" r="7" fill="#F59E0B"/>
  <circle cx="340" cy="115" r="10" fill="#F59E0B" stroke="#FFF" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- A++ Badge Symbol -->
  <g transform="translate(186, 395)">
    <rect width="140" height="42" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="70" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#10B981" text-anchor="middle" letter-spacing="1">A++ CAP</text>
  </g>
</svg>
