<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- PWA Meta 標籤 -->
  <title>學業成績智慧彙整與多維分析系統 | 國中教育會考落點診斷</title>
  <meta name="description" content="專為中學升學考生打造的個人化學業成績管理與會考診斷多維分析平台，支援飛書多維表格視圖、英數加權運算、就學區積點與志願落點診斷。" />
  <meta name="theme-color" content="#0B0D11" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CAP多維分析" />
  
  <!-- Web App Manifest & App Icons -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />

  <!-- Tailwind CSS (用於極速響應式 Flex/Grid 佈局) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: '#0B0D11',
            surface: '#12151D',
            card: '#161922',
            border: 'rgba(255, 255, 255, 0.08)',
            'primary-blue': '#3B82F6',
            'primary-purple': '#8B5CF6',
            success: '#10B981',
            warning: '#F59E0B',
            danger: '#EF4444'
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons & Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- 客製化深色精緻介面樣式 -->
  <link rel="stylesheet" href="./css/styles.css?v=15" />
</head>
<body class="bg-[#0B0D11] text-[#F3F4F6]">

  <div class="app-container">
    
    <!-- 頂部主導覽列 -->
    <header class="app-navbar">
      <div class="brand-container">
        <img src="./icons/icon.svg" alt="CAP Tracker" class="brand-logo shadow-sm" />
        <div class="min-w-0">
          <h1 class="brand-title truncate">學業成績智慧彙整系統</h1>
          <p class="brand-subtitle hidden sm:block">國中會考計分規範 • 多維表格分析</p>
        </div>
      </div>

      <!-- 學生簡歷與全域功能列 -->
      <div class="flex items-center gap-2">
        <!-- 雲端高頻背景同步指示燈 -->
        <div id="cloud-sync-badge" class="cloud-sync-badge cursor-pointer" onclick="App.openSettingsModal()" title="Google 試算表高頻背景同步：點擊查看設定">
          <span class="sync-dot sync-dot-green"></span>
          <span id="cloud-sync-text" class="text-3xs font-mono text-muted hidden sm:inline">已連線</span>
        </div>

        <!-- 手機端專屬帳密/切換帳號按鈕 -->
        <button class="p-1.5 rounded-lg bg-surface border border-border text-primary-blue sm:hidden" onclick="App.openAuthModal('login')" title="登入、註冊或切換帳號">
          <i data-lucide="user" class="w-3.5 h-3.5"></i>
        </button>

        <!-- 學生檔案與帳號標籤 (中大螢幕顯示，點擊開啟帳號切換/個人設定) -->
        <div class="hidden md:flex items-center gap-2 px-2.5 py-1 rounded-lg bg-surface border border-border cursor-pointer hover:border-primary-blue/40 transition-colors" onclick="App.openAuthModal('login')" title="點擊登入、註冊或切換帳號">
          <div class="w-5 h-5 rounded-full bg-primary-blue/20 text-primary-blue flex items-center justify-center font-bold text-xs">
            <i data-lucide="user" class="w-3 h-3"></i>
          </div>
          <div>
            <div id="header-student-name" class="text-xs font-bold text-primary">小虎</div>
            <div id="header-school-info" class="text-3xs text-muted font-mono">littletiger0815@gmail.com</div>
          </div>
        </div>

        <!-- 列印 / 匯出 PDF 診斷書 (桌面專用) -->
        <button class="btn-secondary text-xs hidden md:inline-flex" title="列印 / 產生會考診斷報告書" onclick="ExportImport.printDiagnosticReport()">
          <i data-lucide="printer" class="w-3.5 h-3.5 inline mr-1 text-secondary"></i>
          <span>列印</span>
        </button>

        <!-- GAS 雲端同步與設定 (平板/電腦版按鈕，手機由右上角綠色徽章開啟) -->
        <button class="btn-secondary text-xs hidden sm:inline-flex" title="Google Apps Script 雲端同步設定" onclick="App.openSettingsModal()">
          <i data-lucide="cloud" class="w-3.5 h-3.5 inline mr-1 text-primary-blue"></i>
          <span>雲端</span>
        </button>

        <!-- 快速錄入成績主要按鈕 (電腦平板專用，手機有底部中央懸浮 + 按鈕) -->
        <button class="btn-primary text-xs hidden sm:inline-flex" onclick="App.openQuickAddModal()">
          <i data-lucide="plus" class="w-3.5 h-3.5 inline mr-1"></i>
          <span>錄入成績</span>
        </button>
      </div>
    </header>

    <!-- 次導覽列：模組切換 (Module Tabs) 與 多維視圖切換 (View Tabs) -->
    <nav class="sub-navbar">
      
      <!-- 評量模組切換 (手機全寬均分，流暢自適應) -->
      <div class="flex items-center w-full md:w-auto">
        <span class="text-2xs text-muted font-medium hidden lg:inline mr-2">評量模組：</span>
        <div class="module-tabs w-full md:w-auto">
          <button class="module-tab-btn active" data-module="mock" onclick="App.switchModule('mock')">
            <i data-lucide="target" class="w-3.5 h-3.5"></i>
            <span>會考模擬考</span>
          </button>
          <button class="module-tab-btn" data-module="term" onclick="App.switchModule('term')">
            <i data-lucide="award" class="w-3.5 h-3.5"></i>
            <span>定期段考</span>
          </button>
          <button class="module-tab-btn" data-module="quiz" onclick="App.switchModule('quiz')">
            <i data-lucide="file-check" class="w-3.5 h-3.5"></i>
            <span>小考評量</span>
          </button>
        </div>
      </div>

      <!-- 飛書多維表格視圖切換 (手機端由底部導覽切換，桌面端在此展示) -->
      <div class="hidden md:flex items-center gap-2">
        <span class="text-2xs text-muted font-medium hidden lg:inline">多維視圖：</span>
        <div class="view-tabs">
          <button class="view-tab-btn active" data-view="dashboard" onclick="App.switchView('dashboard')">
            <i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i>
            <span>戰情儀表板</span>
          </button>
          <button class="view-tab-btn" data-view="grid" onclick="App.switchView('grid')">
            <i data-lucide="table" class="w-3.5 h-3.5"></i>
            <span>表格視圖</span>
          </button>
          <button class="view-tab-btn" data-view="kanban" onclick="App.switchView('kanban')">
            <i data-lucide="kanban-square" class="w-3.5 h-3.5"></i>
            <span>掌握度看板</span>
          </button>
          <button class="view-tab-btn" data-view="gallery" onclick="App.switchView('gallery')">
            <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
            <span>錯題筆記畫廊</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- 主要視圖渲染區域 -->
    <main class="main-content">
      <div id="view-content-area">
        <!-- 視圖由 JavaScript 動態渲染 -->
      </div>
    </main>

    <!-- 手機版專屬底部導覽列 (Mobile Bottom Navigation Bar) -->
    <nav class="mobile-bottom-nav md:hidden">
      <button class="mobile-nav-btn active" data-view="dashboard" onclick="App.switchView('dashboard')">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span>戰情</span>
      </button>
      <button class="mobile-nav-btn" data-view="grid" onclick="App.switchView('grid')">
        <i data-lucide="table" class="w-5 h-5"></i>
        <span>表格</span>
      </button>
      <!-- 中央醒目浮動錄入按鈕 -->
      <button class="mobile-nav-btn mobile-fab-btn" onclick="App.openQuickAddModal()" title="快速錄入">
        <div class="fab-circle">
          <i data-lucide="plus" class="w-6 h-6 text-white"></i>
        </div>
        <span>錄入</span>
      </button>
      <button class="mobile-nav-btn" data-view="kanban" onclick="App.switchView('kanban')">
        <i data-lucide="kanban-square" class="w-5 h-5"></i>
        <span>看板</span>
      </button>
      <button class="mobile-nav-btn" data-view="gallery" onclick="App.switchView('gallery')">
        <i data-lucide="book-open" class="w-5 h-5"></i>
        <span>錯題</span>
      </button>
    </nav>

  </div>

  <!-- 彈窗渲染宿主容器 -->
  <div id="modal-host"></div>

  <!-- Toast 訊息提示容器 -->
  <div id="toast-container"></div>

  <!-- 核心腳本載入順序 (含版本防快取) -->
  <script src="./js/constants.js?v=15"></script>
  <script src="./js/auth.js?v=15"></script>
  <script src="./js/scoring.js?v=15"></script>
  <script src="./js/db.js?v=15"></script>
  <script src="./js/charts.js?v=15"></script>
  <script src="./js/views/bitable-grid.js?v=15"></script>
  <script src="./js/views/bitable-kanban.js?v=15"></script>
  <script src="./js/views/bitable-dashboard.js?v=15"></script>
  <script src="./js/views/bitable-gallery.js?v=15"></script>
  <script src="./js/gas-sync.js?v=15"></script>
  <script src="./js/export-import.js?v=15"></script>
  <script src="./js/app.js?v=15"></script>

</body>
</html>
